<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>力量曲線 QUEST</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root { --w1:#24348a; --w2:#0c1552; --line:#f4f4f4; --gold:#f8d030; --hp:#58d858; --mp:#58a8f8; --red:#f85858; --dim:#a8b0e0; --bg:#05060f; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--line); font-family:'DotGothic16','Noto Sans TC','PingFang TC',monospace; -webkit-tap-highlight-color:transparent; }
body { padding:calc(10px + env(safe-area-inset-top)) 10px calc(120px + env(safe-area-inset-bottom)); background-image:radial-gradient(#1a1f4a 1px, transparent 1px); background-size:22px 22px; }
.app { max-width:520px; margin:0 auto; }
.win { position:relative; background:linear-gradient(var(--w1),var(--w2)); border:3px solid var(--line); border-radius:8px;
  box-shadow:0 0 0 3px var(--bg), inset 0 0 0 2px var(--w2); padding:14px 14px 12px; margin:14px 0; }
.win-t { position:absolute; top:-11px; left:12px; background:var(--w1); padding:0 6px; font-size:13px; color:var(--gold); border:2px solid var(--line); border-radius:4px; line-height:16px; }
.gold { color:var(--gold); } .dim { color:var(--dim); } .red { color:var(--red); } .green { color:var(--hp); } .blue { color:var(--mp); }
.big { font-size:28px; line-height:1; }
.row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:3px 0; font-size:15px; }
.bar { height:10px; background:var(--bg); border:2px solid var(--line); border-radius:3px; overflow:hidden; flex:1; }
.bar > div { height:100%; background:var(--hp); transition:width .3s steps(8); }
.bar.exp > div { background:var(--gold); } .bar.mp > div { background:var(--mp); }
.cmds { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
.cmd { background:none; border:none; color:var(--line); font:inherit; font-size:17px; text-align:left; padding:8px 4px 8px 22px; cursor:pointer; position:relative; border-radius:4px; }
.cmd::before { content:'▶'; position:absolute; left:2px; top:8px; font-size:13px; visibility:hidden; }
.cmd:hover::before, .cmd:focus-visible::before, .cmd.sel::before { visibility:visible; animation:blink .7s steps(2) infinite; }
.cmd:focus-visible { outline:none; background:rgba(255,255,255,.06); }
.cmd:disabled { color:#6a72a8; }
.cmd small { display:block; font-size:12px; color:var(--dim); }
@keyframes blink { 50% { opacity:0; } }
.menu { position:fixed; left:0; right:0; bottom:0; padding:0 10px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
.menu .win { max-width:520px; margin:0 auto; padding:6px 8px; }
.menu .cmds { grid-template-columns:repeat(6,1fr); gap:0; }
.menu .cmd { font-size:13px; padding:10px 0 8px 12px; white-space:nowrap; }
.menu .cmd::before { top:11px; font-size:11px; left:0; }
.sprite { image-rendering:pixelated; display:block; }
.hero-box { display:flex; gap:14px; align-items:center; }
.msg { white-space:pre-line; min-height:74px; font-size:16px; line-height:1.6; cursor:pointer; }
.msg::after { content:'▼'; position:absolute; right:12px; bottom:6px; font-size:11px; animation:blink .7s steps(2) infinite; }
.arena { position:relative; height:200px; display:flex; align-items:center; justify-content:center; }
.arena .sprite { transition:transform .08s; }
.arena .hit { filter:brightness(3) saturate(0); transform:translateX(6px); }
.arena .dead { animation:die 1s steps(6) forwards; }
@keyframes die { to { opacity:0; transform:translateY(20px) scaleY(.2); } }
.dmg { position:absolute; font-size:30px; color:#fff; text-shadow:2px 2px 0 #000, -2px -2px 0 #000; pointer-events:none; animation:dmg .7s steps(7) forwards; }
.dmg.crit { color:var(--gold); font-size:40px; }
@keyframes dmg { 0% { transform:translateY(0); } 30% { transform:translateY(-24px); } 100% { transform:translateY(-40px); opacity:0; } }
.flash { animation:flash .3s steps(2) 2; }
@keyframes flash { 50% { background:#fff; } }
.shake { animation:shake .2s steps(4); }
@keyframes shake { 25% { transform:translate(-5px,2px); } 75% { transform:translate(5px,-2px); } }
.modal { position:fixed; inset:0; background:rgba(5,6,15,.8); z-index:40; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal[hidden] { display:none; }
.modal .win { width:100%; max-width:420px; max-height:84vh; overflow-y:auto; padding-top:30px; }
.modal .win > .win-t:first-child { top:6px; }
.step { display:flex; align-items:center; justify-content:center; gap:6px; margin:10px 0; }
.step button { background:var(--w2); color:var(--line); border:2px solid var(--line); border-radius:4px; font:inherit; font-size:15px; min-width:46px; height:40px; cursor:pointer; }
.step b { font-size:26px; min-width:96px; text-align:center; color:var(--gold); font-weight:400; }
input.txt, select.txt { width:100%; background:var(--bg); color:var(--line); border:2px solid var(--line); border-radius:4px; font:inherit; font-size:16px; padding:8px; margin:6px 0; }
.heat { display:flex; gap:2px; overflow-x:auto; padding:4px 0; }
.heat-col { display:flex; flex-direction:column; gap:2px; }
.tile { width:14px; height:14px; border-radius:2px; }
.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl td, .tbl th { padding:4px 4px; text-align:right; font-weight:400; white-space:nowrap; }
.tbl td:first-child, .tbl th:first-child { text-align:left; }
.tbl th { color:var(--dim); }
.scroll { overflow-x:auto; }
.log-row { display:flex; justify-content:space-between; padding:4px 0 4px 18px; font-size:15px; cursor:pointer; position:relative; }
.log-row::before { content:'▶'; position:absolute; left:0; font-size:12px; top:6px; visibility:hidden; }
.log-row:hover::before { visibility:visible; }
.lvup { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.lvup span { font-size:46px; color:var(--gold); text-shadow:3px 3px 0 #000; animation:lv 1.6s steps(8) forwards; }
@keyframes lv { 0% { transform:scale(.3); } 25% { transform:scale(1.2); } 40%,80% { transform:scale(1); opacity:1; } 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

.atk { display:block; width:100%; margin:14px 0; height:96px; border:3px solid var(--line); border-radius:10px; background:linear-gradient(#e04848,#a01828);
  color:#fff; font:inherit; font-size:34px; letter-spacing:6px; cursor:pointer; box-shadow:0 0 0 3px var(--bg), 0 7px 0 3px #5a0c16; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
.atk:active { transform:translateY(6px); box-shadow:0 0 0 3px var(--bg), 0 1px 0 3px #5a0c16; }
.atk small { display:block; font-size:13px; letter-spacing:0; opacity:.9; }
.atk:disabled { filter:grayscale(.8) brightness(.6); }
.param { display:grid; grid-template-columns:52px 1fr; align-items:center; gap:6px; margin:6px 0; }
.param .step { margin:0; justify-content:flex-end; }
.param .step b { min-width:70px; font-size:22px; }
.param .step button { min-width:40px; height:36px; font-size:14px; }
.chips { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
.chips button { background:var(--w2); color:var(--dim); border:2px solid #5a64a8; border-radius:4px; font:inherit; font-size:13px; padding:4px 6px; cursor:pointer; }
.chips button.on { color:var(--bg); background:var(--gold); border-color:var(--line); }
.aura { animation:aura 1.6s ease-in-out infinite; }
@keyframes aura { 50% { filter:drop-shadow(0 0 6px #f8d030) drop-shadow(0 0 14px #f89838); } }
.board-row { display:grid; grid-template-columns:28px 40px 1fr auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px dashed #3a4a9a; }
.board-row.me { background:rgba(248,208,48,.08); }
</style>
</head>
<body>
<div class="app" id="screen"></div>
<nav class="menu"><div class="win"><div class="cmds" id="menu"></div></div></nav>
<div class="modal" id="modal" hidden><div class="win" id="modalWin"></div></div>
<script>
// ================= 核心資料與計算（與原版相同，資料完全相容） =================
const RPE_TABLE = {
  10:[100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9], 9.5:[97.8,93.9,90.7,87.8,85.0,82.4,79.9,77.4,75.1,72.8],
  9:[95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7], 8.5:[93.9,90.7,87.8,85.0,82.4,79.9,77.4,75.1,72.8,70.7],
  8:[92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4], 7.5:[90.7,87.8,85.0,82.4,79.9,77.4,75.1,72.8,70.7,68.6],
  7:[89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.4], 6.5:[87.8,85.0,82.4,79.9,77.4,75.1,72.8,70.7,68.6,66.7],
  6:[86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.4,65.6],
};
const MAIN_LIFTS = { squat:{label:'深蹲'}, bench:{label:'臥推'}, deadlift:{label:'硬舉'} };
const LIFTS = ['squat','bench','deadlift'];
const BLOCK_TYPES = {
  accumulation:{label:'累積期',color:'#58d858',pct:[65,80]}, intensification:{label:'強化期',color:'#b088f8',pct:[75,87]},
  peaking:{label:'巔峰期',color:'#f89838',pct:[85,95]}, deload:{label:'減量週',color:'#a8b0e0',pct:[55,70]},
  test:{label:'測試／比賽',color:'#f8d030',pct:[90,105]},
};
const WD = ['日','一','二','三','四','五','六'];
const RPE_SKILLS = [
  {v:'',n:'不計'}, {v:6,n:'試探'}, {v:7,n:'穩擊'}, {v:7.5,n:'穩擊+'}, {v:8,n:'強擊'}, {v:8.5,n:'強擊+'},
  {v:9,n:'奮力'}, {v:9.5,n:'捨身'}, {v:10,n:'極限'},
];

const pad = n => String(n).padStart(2,'0');
const fmtDate = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => fmtDate(new Date());
const parseDate = s => new Date(s+'T00:00:00');
const addDays = (s,n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); };
const daysBetween = (a,b) => Math.round((parseDate(b)-parseDate(a))/86400000);
const getMonday = s => { const d = parseDate(s), w = d.getDay(); d.setDate(d.getDate()+((w===0?-6:1)-w)); return fmtDate(d); };
const wd = s => WD[parseDate(s).getDay()];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1 = x => Math.round(x*10)/10;
const roundTo = (x,s) => Math.round(x/s)*s;
const fmtNum = n => Math.round(n).toLocaleString();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function pctFor(reps, rpe) { const t = RPE_TABLE[rpe]; if (!t) return null; return t[Math.min(Math.max(Math.round(reps),1),10)-1]; }
function calcE1RM(w, r, rpe) { return w / ((pctFor(r,rpe) ?? pctFor(r,8))/100); }
const rowVolume = r => r.weight*r.reps*r.sets;
const cardVolume = c => c.rows.reduce((s,r)=>s+rowVolume(r),0);
function cardBestE1RM(c) {
  if (c.category!=='main') return null;
  const w = c.rows.filter(r=>r.rpe!=null); if (!w.length) return null;
  return round1(Math.max(...w.map(r=>calcE1RM(r.weight,r.reps,r.rpe))));
}
const liftCards = k => entries.filter(c=>c.category==='main'&&c.lift===k);
function refE1RM(k, upto, win=42) {
  upto = upto||todayStr(); const from = addDays(upto,-win);
  let best=null, fb=null, fbD='';
  liftCards(k).forEach(c => { if (c.date>upto) return; const e = cardBestE1RM(c); if (e==null) return;
    if (c.date>from) { if (best==null||e>best) best=e; } else if (c.date>fbD) { fbD=c.date; fb=e; } });
  return best ?? fb;
}
function allTimeBest(k) { let b=null; liftCards(k).forEach(c=>{ const e=cardBestE1RM(c); if (e!=null&&(!b||e>b.val)) b={val:e,date:c.date}; }); return b; }
function repBest(k, n) { let b=null; liftCards(k).forEach(c=>c.rows.forEach(r=>{ if (r.reps>=n&&(!b||r.weight>b.weight)) b={weight:r.weight,date:c.date}; })); return b; }
function rowInol(r, ref) { if (!ref) return 0; const p = Math.min(r.weight/ref*100,99); return r.reps*r.sets/(100-p); }
function hardSets(r, ref) { if (r.rpe!=null) return r.rpe>=7?r.sets:0; return (ref&&r.weight/ref>=0.7)?r.sets:0; }
function linSlope(pts) { const n=pts.length; if (n<2) return null; const mx=pts.reduce((s,p)=>s+p.x,0)/n, my=pts.reduce((s,p)=>s+p.y,0)/n;
  let a=0,b=0; pts.forEach(p=>{a+=(p.x-mx)*(p.y-my); b+=(p.x-mx)**2;}); return b?a/b:null; }
function dots(total, bw, sex) {
  const c = sex==='female' ? [-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706] : [-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093];
  const b = Math.min(Math.max(bw,40), sex==='female'?150:210);
  return total*500/(c[0]+c[1]*b+c[2]*b**2+c[3]*b**3+c[4]*b**4);
}
function migrateLegacyEntries(raw) {
  if (!Array.isArray(raw)) return [];
  if (!raw.some(e=>!Array.isArray(e.rows))) return raw;
  const out = [];
  raw.forEach(e => {
    if (Array.isArray(e.rows)) { out.push(e); return; }
    let c = out.find(x=>x.date===e.date&&x.category===e.category&&(e.category==='main'?x.lift===e.lift:x.exerciseName===e.exerciseName));
    if (!c) { c = {id:e.id||uid(), date:e.date, category:e.category, lift:e.category==='main'?e.lift:null, exerciseName:e.category==='accessory'?e.exerciseName:null, rows:[]}; out.push(c); }
    c.rows.push({id:(e.id||uid())+'_'+c.rows.length, weight:e.weight, reps:e.reps, sets:e.sets||1, rpe:e.rpe!=null?e.rpe:null});
  });
  return out;
}
const sortedBlocks = () => [...blocks].sort((a,b)=>a.start.localeCompare(b.start));
const blockEnd = b => addDays(b.start, b.weeks*7-1);
const blockAt = d => blocks.find(b=>d>=b.start&&d<=blockEnd(b))||null;
const blockWeek = (b,d) => Math.floor(daysBetween(b.start,d)/7)+1;
const blockLabel = b => b.name || BLOCK_TYPES[b.type].label;

// ================= 狀態與儲存 =================
let entries = [], profile = { bodyweight:null, sex:'male', heroName:'', joinBoard:false }, blocks = [];
let docRef = null, saveTimer = null, user = null, syncText = '本機模式';
let screen = 'status';

const firebaseConfig = {
  apiKey:"AIzaSyCqYNDIkdcL4z8C831J6Y2kopfinKjSziE", authDomain:"power-curve-bfb71.firebaseapp.com", projectId:"power-curve-bfb71",
  storageBucket:"power-curve-bfb71.firebasestorage.app", messagingSenderId:"100155224305", appId:"1:100155224305:web:3f116ee493692400c57950",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();

function loadLocal() {
  try { entries = migrateLegacyEntries(JSON.parse(localStorage.getItem('pl_entries')||'[]')); } catch { entries = []; }
  try { profile = Object.assign({bodyweight:null,sex:'male',heroName:'',joinBoard:false}, JSON.parse(localStorage.getItem('pl_profile')||'{}')); } catch {}
  try { const b = JSON.parse(localStorage.getItem('pl_blocks')||'[]'); blocks = Array.isArray(b)?b:[]; } catch { blocks = []; }
}
auth.onAuthStateChanged(async u => {
  user = u;
  if (!u) { docRef = null; syncText = '本機模式'; loadLocal(); render(); return; }
  docRef = db.collection('powerCurveEntries').doc(u.uid);
  try {
    const snap = await docRef.get();
    if (snap.exists && snap.data().entries) {
      const d = snap.data();
      entries = migrateLegacyEntries(d.entries);
      profile = d.profile ? Object.assign({ heroName:'', joinBoard:false }, d.profile, { bodyweight:d.profile.bodyweight??null, sex:d.profile.sex||'male' }) : profile;
      blocks = Array.isArray(d.blocks) ? d.blocks : blocks;
    } else { loadLocal(); if (entries.length) save(); }
    syncText = '雲端同步';
  } catch { syncText = '連線失敗・本機模式'; loadLocal(); }
  render();
});
function save() {
  entries.sort((a,b)=>a.date.localeCompare(b.date));
  localStorage.setItem('pl_entries', JSON.stringify(entries));
  localStorage.setItem('pl_profile', JSON.stringify(profile));
  localStorage.setItem('pl_blocks', JSON.stringify(blocks));
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await docRef.set({ entries, profile, blocks, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); syncText = '雲端同步'; syncBoard(); }
    catch { syncText = '同步失敗'; }
  }, 500);
}
function login() { const p = new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p)); }

// ================= RPG 數值 =================
const lvExp = L => 250*(L-1)*(L-1);
function rpgState() {
  const exp = Math.floor(entries.reduce((s,c)=>s+cardVolume(c),0)/10);
  let L = 1; while (exp >= lvExp(L+1)) L++;
  const cur = LIFTS.map(k => refE1RM(k) || 0);
  const total = cur.every(Boolean) ? cur[0]+cur[1]+cur[2] : null;
  const power = total && profile.bodyweight ? dots(total, profile.bodyweight, profile.sex) : null;
  return { exp, L, cur, total, power };
}
function jobOf(sq, bp, dl) {
  if (!sq || !bp || !dl) return '見習冒險者';
  if (dl/sq > 1.25) return '破城者';
  if (bp/sq > 0.75) return '重槍騎士';
  if (dl/sq < 1.05) return '鐵壁守衛';
  return '全能戰士';
}
function rankOf(p) {
  return p >= 530 ? ['傳說','#f89838'] : p >= 470 ? ['秘銀','#78d8f8'] : p >= 400 ? ['黃金','#f8d030'] :
         p >= 320 ? ['白銀','#d8dce8'] : p >= 250 ? ['青銅','#c88850'] : ['見習','#a8b0e0'];
}
const heroName = () => (profile.heroName || (user && user.displayName ? user.displayName.split(' ')[0] : '勇者'));

// ================= 像素圖 =================
const SPRITES = {
  squat: { name:'岩石巨像', pal:{g:'#606878',G:'#9098a8',r:'#f83838'},
    px:["....gggggg....","...gGGGGGGg...","..gGrGGGGrGg..","..gGGGGGGGGg..",".ggGGgggggGgg.","gGGGGGGGGGGGGg","gGgGGGGGGGGgGg","gGg.gGGGGg.gGg","ggg.gGGGGg.ggg","....gGggGg....","...ggg..ggg...","...ggg..ggg..."] },
  bench: { name:'熔岩幼龍', pal:{r:'#a82818',O:'#f87828',y:'#f8f048',w:'#f8f8f8',R:'#c83828',o:'#f8c860'},
    px:["..r........r..","..rr......rr..","...rOOOOOOr...","..OOyOOOOyOO..","..OOOOOOOOOO..","...OOwwwwOO...",".RR.OOOOOO.RR.","RRRROOooOORRRR","RR..OOooOO..RR","....OOooOO....","...OO....OO...","..OOO....OOO.."] },
  deadlift: { name:'深淵鬼王', pal:{k:'#e8e8e8',P:'#8838b8',y:'#f8f048',w:'#f8f8f8'},
    px:[".k..........k.",".kk........kk.","..kPPPPPPPPk..","..PPyPPPPyPP..","..PPPPPPPPPP..","..PwPwPwPwPP..","...PPPPPPPP...",".PPPPPPPPPPPP.","PP.PPPPPPPP.PP","P..PP....PP..P","...PP....PP...","..PPP....PPP.."] },
  acc: { name:'荒野狼', pal:{b:'#384878',B:'#7888b8',y:'#f8e048',k:'#181818'},
    px:["..b.......b...","..bb.....bb...","..bBBBBBBBb...",".bBByBBBByBb..",".bBBBBBBBBBb..","..bBBkkkBBb...","...bBBBBBb....","..bBBBBBBBBbbb",".bBBBBBBBBBBbb",".bBb.bBb.bBb..",".bb..bb..bb..."] },
};
function sprite(key, size) {
  const s = SPRITES[key], h = s.px.length, w = Math.max(...s.px.map(r=>r.length));
  let r = '';
  s.px.forEach((row,y) => [...row].forEach((ch,x) => { if (s.pal[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${s.pal[ch]}"/>`; }));
  return `<svg class="sprite" viewBox="0 0 ${w} ${h}" width="${size}" height="${size*h/w}" shape-rendering="crispEdges">${r}</svg>`;
}
const monKey = c => c.category==='main' ? c.lift : 'acc';

// ---- 勇者外觀：依性別與三項總和變化 ----

const ODD_TWEAK = [ {}, {W:'#a8d8f8'}, {}, {}, {}, {c:'#8838b8'}, {W:'#a8f8f8'}, {F:'#f8f8f8'}, {c:'#f8d030'}, {F:'#f8d030', W:'#f8f8f8'} ];
const TIER_PAL = Array.from({length:20}, (_,i) => Object.assign({}, BASE_PAL[i>>1], i%2 ? Object.assign({ k:'#f8d030' }, ODD_TWEAK[i>>1]) : {}));
function heroPx(sex, t20) {
  const tier = t20 >> 1, odd = t20 % 2;
  const W = 20, H = 16, g = Array.from({length:H}, () => Array(W).fill('.'));
  const put = (x,y,ch) => { if (x>=0&&x<W&&y>=0&&y<H) g[y][x] = ch; };
  const stamp = (rows, ox, oy) => rows.forEach((r,y) => [...r].forEach((ch,x) => { if (ch!=='.') put(ox+x, oy+y, ch); }));
  // 槓鈴：槓片越來越多
  for (let x = 1; x < W-1; x++) put(x, 1, 'w');
  const plates = 1 + Math.floor(t20/5);
  for (let i = 0; i < plates; i++) for (let y = 0; y < 3; y++) { put(i, y, 'p'); put(W-1-i, y, 'p'); }
  // 頭
  let head = sex==='female'
    ? ['..hhhhhh..','.hhhhhhhh.','.hhsssshh.','.hsessesh.','.h.ssss.h.']
    : ['...hhhh...','..hhhhhh..','..hssssh..','..sesses..','...ssss...'];
  if (tier >= 4) head = head.map((r,i) => i < 2 ? r.replace(/h/g,'m') : r);
  stamp(head, 5, 3);
  if (tier >= 8) stamp(['..y.yy.y..'], 5, 2);
  // 身體：越強越壯
  const thin = ['...a.tttt.a...','...a.tttt.a...','...s.tttt.s...','.....tttt.....','.....bbbb.....','....bb..bb....','....bb..bb....','...kkk..kkk...'];
  const mid  = ['...aattttaa...','...a.tttt.a...','...s.tttt.s...','....tttttt....','....bbbbbb....','....bb..bb....','....bb..bb....','...kkk..kkk...'];
  const buff = ['..aattttttaa..','.aaa.tttt.aaa.','.ss..tttt..ss.','....tttttt....','....bbbbbb....','...bbb..bbb...','...bbb..bbb...','..kkkk..kkkk..'];
  const huge = ['.aaattttttaaa.','aaaatttttttaaa','ss..tttttt..ss','...tttttttt...','....bbbbbb....','...bbb..bbb...','...bbb..bbb...','..kkkk..kkkk..'];
  let body = (tier >= 7 ? huge : tier >= 4 ? buff : tier >= 2 ? mid : thin).slice();
  if (tier >= 5) body = body.map((r,i) => i < 5 ? 'c' + r.slice(1,13) + 'c' : r);
  if (odd) body[4] = body[4].replace(/b/g,'L');
  stamp(body, 3, 8);
  const handRow = 10, hr = body[2], rx = 3 + hr.lastIndexOf('s'), lx = 3 + hr.indexOf('s');
  // 武器（右手）
  const wx = rx + 1;
  const blade = [0,4,3,5,5,7,7,8,8,9][tier] + (tier >= 1 ? odd : 0);
  if (tier === 1) for (let i = 0; i < blade; i++) put(wx, handRow-i, 'n');
  else if (tier >= 2) {
    put(wx, handRow+1, 'n'); put(wx, handRow, 'n');
    if (tier >= 3) { put(wx-1, handRow-1, 'H'); put(wx, handRow-1, 'H'); put(wx+1, handRow-1, 'H'); }
    for (let i = 0; i < blade; i++) {
      const y = handRow - 2 - i + (tier < 3 ? 1 : 0);
      const ch = tier >= 7 && i % 2 ? 'F' : 'W';
      put(wx, y, ch); if (tier >= 5) put(wx+1, y, ch);
    }
  }
  // 盾（左手）
  if (tier >= 4) {
    const sx = lx - 3, big = tier >= 5;
    for (let y = handRow-2; y <= handRow+(big?2:1); y++) for (let x = sx; x < sx+3; x++) put(x, y, 'S');
    put(sx+1, handRow-1, 'E'); if (big) put(sx+1, handRow, 'E');
  }
  return g.map(r => r.join(''));
}
function heroSprite(sex, total, size) {
  const tier = tierOf(total, sex);
  const pal = Object.assign({ h: sex==='female' ? '#783818' : '#3a2410', s:'#f8c890', e:'#101010', w:'#c8c8d8' }, TIER_PAL[tier]);
  SPRITES['_hero'] = { pal, px: heroPx(sex, tier) };
  const svg = sprite('_hero', size);
  return tier >= 18 ? svg.replace('class="sprite"', 'class="sprite aura"') : svg;
}

let actx = null;
function beep(notes, type='square', len=.09) {
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime+i*len;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+len*1.2);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+len*1.3); });
  } catch {}
}
const SFX = { cursor:()=>beep([1200],'square',.03), hit:()=>beep([220,110],'sawtooth',.05), crit:()=>beep([880,440,220],'sawtooth',.05),
  ok:()=>beep([660,990],'square',.06), win:()=>beep([523,523,523,659,784,659,784,1047],'square',.11), lv:()=>beep([784,988,1175,1568],'triangle',.12),
  rest:()=>beep([523,659,784,659,523],'triangle',.15) };
function buzz(strong) {
  const H = window.Capacitor?.Plugins?.Haptics;
  if (H) H.impact({ style: strong ? 'HEAVY' : 'LIGHT' }).catch(()=>{});
  else if (navigator.vibrate) navigator.vibrate(strong ? [30,30,50] : 12);
}

let typeTimer = null;

function attack() {

  const dmg = Math.round(B.w);
  const wasAlive = hpLeft() > 0;
  B.dmg += dmg;
  B.fatigue += (B.rpe !== '' ? B.rpe : 7) * 1.2;
  renderBattle();

  sp.classList.add('hit'); setTimeout(() => sp.classList.remove('hit'), 80);
  const d = document.createElement('div'); d.className = 'dmg' + (crit?' crit':''); d.textContent = dmg;
  d.style.left = (35+Math.random()*25)+'%'; d.style.top = (30+Math.random()*20)+'%'; ar.appendChild(d); setTimeout(()=>d.remove(), 700);
  if (crit) { document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); SFX.crit(); buzz(true); }
  else { SFX.hit(); buzz(false); }
  const lines = [`${heroName()} 的攻擊！第 ${B.reps} 下`, crit ? `會心一擊！${B.name} 受到 ${dmg} 點傷害！` : `${B.name} 受到 ${dmg} 點傷害。`];
  if (wasAlive && hpLeft() <= 0) { lines.push(`${B.name} 搖搖欲墜……按「結束這一組」給牠最後一擊！`); }
  say(lines);
}
function snap() {
  const s = rpgState();

function endTurn() {

  if (!card) { card = { id:uid(), date, category:B.cat, lift:B.cat==='main'?B.key:null, exerciseName:B.cat==='accessory'?B.key:null, rows:[] }; entries.push(card); }

    [1,3,5,8].forEach((n,i) => { if (b.r[i] && a.r[i] > b.r[i]) lines.push(`◆ 獲得「${nm}之證・${n}RM ${a.r[i]}kg」！`); });
  }

}
function restWin() {

let curveEx = 'main:squat', curveMetric = 'e1rm';
function curveSeries() {
  const [kind, key] = curveEx.split(/:(.+)/);
  const cards = entries.filter(c => kind==='main' ? c.category==='main'&&c.lift===key : c.category==='accessory'&&c.exerciseName===key)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const metric = kind !== 'main' && curveMetric === 'e1rm' ? 'top' : curveMetric;
  const pts = cards.map(c => ({ d:c.date, v: metric==='e1rm' ? cardBestE1RM(c) : metric==='top' ? Math.max(...c.rows.map(r=>r.weight)) : Math.round(cardVolume(c)) }))
    .filter(p => p.v != null);
  return { kind, key, metric, pts };
}
function pixelChart(pts, color) {
  if (pts.length < 1) return '<div class="dim">還沒有足夠的紀錄可以畫曲線。</div>';
  const W = 320, H = 150, L = 40, R = 8, T = 10, Bm = 24;
  const vs = pts.map(p=>p.v), lo0 = Math.min(...vs), hi0 = Math.max(...vs);
  const padv = (hi0-lo0)*0.15 || hi0*0.1 || 1, lo = Math.max(0, lo0-padv), hi = hi0+padv;
  const x = i => L + (pts.length===1 ? (W-L-R)/2 : i*(W-L-R)/(pts.length-1));
  const y = v => T + (1-(v-lo)/(hi-lo))*(H-T-Bm);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" shape-rendering="crispEdges" style="display:block;font-family:inherit">`;
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi-lo)*i/3, yy = Math.round(y(v));
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#3a4a9a" stroke-dasharray="2 3"/><text x="${L-4}" y="${yy+4}" fill="#a8b0e0" font-size="10" text-anchor="end">${fmtNum(v)}</text>`;
  }
  let path = '';
  pts.forEach((p,i) => { const xx = Math.round(x(i)), yy = Math.round(y(p.v)); path += i ? ` H${xx} V${yy}` : `M${xx} ${yy}`; });
  s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="3"/>`;
  const bestI = vs.indexOf(hi0);
  pts.forEach((p,i) => { const xx = Math.round(x(i)), yy = Math.round(y(p.v)), b = i===bestI;
    s += `<rect x="${xx-(b?5:3)}" y="${yy-(b?5:3)}" width="${b?10:6}" height="${b?10:6}" fill="${b?'#f8d030':color}" stroke="#05060f" stroke-width="1"><title>${p.d}：${p.v}</title></rect>`; });
  if (bestI >= 0) s += `<text x="${Math.min(W-R-20, Math.max(L+10, x(bestI)))}" y="${Math.max(12, y(hi0)-9)}" fill="#f8d030" font-size="10" text-anchor="middle">★${hi0}</text>`;
  s += `<text x="${L}" y="${H-6}" fill="#a8b0e0" font-size="10">${pts[0].d.slice(5)}</text><text x="${W-R}" y="${H-6}" fill="#a8b0e0" font-size="10" text-anchor="end">${pts[pts.length-1].d.slice(5)}</text></svg>`;
  return s;
}
function curveWin() {
  const accs = [...new Set(entries.filter(c=>c.category==='accessory').map(c=>c.exerciseName))].sort();
  const opts = [...LIFTS.map(k=>['main:'+k, MAIN_LIFTS[k].label]), ...accs.map(n=>['acc:'+n, n])];
  const { kind, metric, pts } = curveSeries();
  const metrics = kind==='main' ? [['e1rm','推測極限'],['top','最重'],['vol','總傷害']] : [['top','最重'],['vol','總傷害']];
  const color = metric==='vol' ? '#58d858' : '#78d8f8';
  const last = pts[pts.length-1], prev = pts[pts.length-2];
  const diff = last && prev ? round1(last.v - prev.v) : null;
  return win('修煉曲線', `<select class="txt" id="curveSel">${opts.map(([v,l])=>`<option value="${esc(v)}"${v===curveEx?' selected':''}>${esc(l)}</option>`).join('')}</select>
    <div class="chips" style="justify-content:flex-start;margin:4px 0 8px">${metrics.map(([v,l])=>`<button data-m="${v}" class="${v===metric?'on':''}">${l}</button>`).join('')}</div>
    ${pixelChart(pts, color)}
    ${last ? `<div class="row" style="font-size:13px"><span class="dim">最近 ${last.d.slice(5)}</span><span>${last.v}${metric==='vol'?'':'kg'}${diff!=null?` <span class="${diff>0?'green':diff<0?'red':'dim'}">${diff>0?'+':''}${diff}</span>`:''}</span></div>` : ''}
    <div class="dim" style="font-size:12px">共 ${pts.length} 次紀錄・金色方塊＝最佳・點日誌可修改數字</div>`);
}

// ================= 情報 =================
let intelLift = 'squat';
function renderIntel() {
  const today = todayStr(), from28 = addDays(today,-28), from56 = addDays(today,-56);
  const first = entries.length ? entries.reduce((m,c)=>c.date<m?c.date:m, entries[0].date) : today;
  const weeks = Math.min(4, Math.max(1, (daysBetween(first,today)+1)/7));
  const rows = LIFTS.map(k => {
    const tp = liftCards(k).filter(c=>c.date>from56).map(c=>({d:c.date,y:cardBestE1RM(c)})).filter(p=>p.y!=null).sort((a,b)=>a.d.localeCompare(b.d));
    const sl = tp.length>=3 ? linSlope(tp.map(p=>({x:daysBetween(tp[0].d,p.d),y:p.y}))) : null;
    let hard = 0, inol = 0;
    liftCards(k).filter(c=>c.date>from28).forEach(c => { const r = refE1RM(k,c.date); c.rows.forEach(x => { hard += hardSets(x,r); inol += rowInol(x,r); }); });
    const s = sl==null ? null : sl*7;
    return `<tr><td>${sprite(k,22)}</td><td class="${s==null?'dim':s>0.2?'green':s<-0.2?'red':'gold'}">${s==null?'—':(s>0?'+':'')+s.toFixed(1)}</td>
      <td>${hard?(hard/weeks).toFixed(1):'—'}</td><td>${inol?(inol/weeks).toFixed(2):'—'}</td></tr>`;
  }).join('');
  const vm = {}; entries.forEach(c => vm[c.date] = (vm[c.date]||0)+cardVolume(c));
  const sum = (a,b) => Object.entries(vm).filter(([d])=>d>a&&d<=b).reduce((s,[,v])=>s+v,0);
  const acute = sum(addDays(today,-7),today), chronic = sum(from28,today)/4, acwr = chronic ? acute/chronic : null;
  const [fc, fl] = acwr==null ? ['dim','情報不足'] : acwr<0.8 ? ['blue','精力充沛・可加量'] : acwr<=1.3 ? ['green','狀態良好'] : acwr<=1.5 ? ['gold','略感疲憊・留意恢復'] : ['red','過勞！建議休息'];
  const e1 = refE1RM(intelLift);
  const book = e1 ? `<div class="scroll"><table class="tbl"><tr><th>次數</th>${[7,8,9].map(r=>`<th>@${r}</th>`).join('')}</tr>
    ${[1,2,3,4,5,6,8].map(n=>`<tr><td>${n} 下</td>${[7,8,9].map(r=>`<td class="${r===8?'gold':''}">${roundTo(e1*pctFor(n,r)/100,2.5)}</td>`).join('')}</tr>`).join('')}</table></div>`
    : '<div class="dim">還沒有這招的情報。記錄一組有 RPE 的頂組後解鎖。</div>';
  $('screen').innerHTML = curveWin() +
    win('成長情報', `<table class="tbl"><tr><th></th><th>成長/週</th><th>每週修煉</th><th>週刺激</th></tr>${rows}</table>
      <div class="dim" style="font-size:12px;margin-top:6px">成長＝近 8 週 e1RM 斜率 kg・修煉＝有效組 6–15 為佳・刺激＝INOL 2–3 為佳</div>`) +
    win('疲勞鑑定', `<div class="row"><span>急慢性負荷比</span><span class="${fc} big" style="font-size:22px">${acwr!=null?acwr.toFixed(2):'—'}</span></div>
      <div class="row"><span class="${fc}">${fl}</span><span class="dim">7 天 ${fmtNum(acute)}</span></div>`) +
    win('技能書', `<div class="cmds" style="grid-template-columns:repeat(3,1fr);margin-bottom:6px">${LIFTS.map(k=>`<button class="cmd${intelLift===k?' sel':''}" onclick="intelLift='${k}';SFX.cursor();renderIntel()">${MAIN_LIFTS[k].label}</button>`).join('')}</div>
      <div class="row"><span>推測極限</span><span class="gold">${e1?round1(e1)+'kg':'—'}</span></div>${book}`);
  $('curveSel').onchange = e => { curveEx = e.target.value; SFX.cursor(); renderIntel(); };
  $('screen').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { curveMetric = b.dataset.m; SFX.cursor(); renderIntel(); });
}

// ================= 英雄榜 =================
// Firestore 規則需加上：
// match /leaderboard/{uid} { allow read: if request.auth != null; allow write: if request.auth != null && request.auth.uid == uid; }
let boardRows = null, boardSort = 'total', boardErr = '';
function myBoardDoc() {
  const lifts = {}; LIFTS.forEach(k => lifts[k] = refE1RM(k) ? round1(refE1RM(k)) : 0);
  const total = round1(lifts.squat + lifts.bench + lifts.deadlift);
  return { name: heroName().slice(0,16), sex: profile.sex, total, ...lifts,
    dots: total && profile.bodyweight && LIFTS.every(k=>lifts[k]) ? round1(dots(total, profile.bodyweight, profile.sex)) : 0,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
}
function syncBoard() {
  if (!user) return;
  const ref = db.collection('leaderboard').doc(user.uid);
  (profile.joinBoard ? ref.set(myBoardDoc()) : ref.delete()).catch(() => {});
}
async function loadBoard() {
  boardErr = '';
  try {
    const snap = await db.collection('leaderboard').orderBy('total','desc').limit(100).get();
    boardRows = snap.docs.map(d => Object.assign({ uid:d.id }, d.data()));
  } catch (e) { boardRows = []; boardErr = '讀取失敗：請確認 Firestore 規則已開放 leaderboard。'; }
  if (screen === 'board') renderBoard();
}
function renderBoard() {
  if (!user) {
    $('screen').innerHTML = win('英雄榜', `<div class="msg" style="min-height:0">要登錄英雄榜，必須先以 Google 登入。</div>
      <button class="cmd sel" onclick="login()">Google 登入</button>`);
    return;
  }
  if (boardRows === null) { $('screen').innerHTML = win('英雄榜', '<div class="msg" style="min-height:0">正在召集各地的英雄……</div>'); loadBoard(); return; }
  const rows = [...boardRows].filter(r => boardSort==='total' ? r.total > 0 : r.dots > 0)
    .sort((a,b) => (b[boardSort]||0) - (a[boardSort]||0));
  const medal = i => i===0 ? '<span class="gold">1</span>' : i===1 ? '<span style="color:#d8dce8">2</span>' : i===2 ? '<span style="color:#c88850">3</span>' : `<span class="dim">${i+1}</span>`;
  $('screen').innerHTML =
    win('登錄', `<div class="row"><span>英雄名</span><span>${esc(heroName())}</span></div>
      <div class="cmds"><button class="cmd" onclick="openHeroName()">更改名字</button>
      <button class="cmd${profile.joinBoard?' sel':''}" onclick="profile.joinBoard=!profile.joinBoard;save();syncBoard();boardRows=null;SFX.ok();renderBoard()">${profile.joinBoard?'已登錄・點此退出':'登錄英雄榜'}<small>公開名字與三項成績</small></button></div>`) +
    win('英雄榜', `<div class="cmds" style="margin-bottom:6px">
        <button class="cmd${boardSort==='total'?' sel':''}" onclick="boardSort='total';SFX.cursor();renderBoard()">三項總和</button>
        <button class="cmd${boardSort==='dots'?' sel':''}" onclick="boardSort='dots';SFX.cursor();renderBoard()">戰力 DOTS</button></div>
      ${boardErr ? `<div class="red">${esc(boardErr)}</div>` : ''}
      ${rows.length ? rows.map((r,i) => `<div class="board-row${r.uid===user.uid?' me':''}">
        <span style="font-size:20px;text-align:center">${medal(i)}</span>${heroSprite(r.sex, r.total, 36)}
        <div><div>${esc(r.name||'無名勇者')}</div>
          <div class="gold" style="font-size:12px">「${titleOf(r.total).name}」<span class="dim">${r.sex==='female'?'♀':'♂'}　蹲${r.squat||'—'} 臥${r.bench||'—'} 硬${r.deadlift||'—'}</span></div></div>
        <span class="gold" style="font-size:18px">${boardSort==='total' ? r.total : r.dots}</span></div>`).join('')
        : '<div class="dim">榜上還沒有英雄。成為第一個吧。</div>'}
      <button class="cmd" onclick="boardRows=null;renderBoard()">重新整理</button>`);
}
function openHeroName() {
  openModal(`<div class="win-t">英雄名</div><input class="txt" id="mHn" maxlength="16" value="${esc(heroName())}">
    <div class="cmds" style="margin-top:8px"><button class="cmd sel" onclick="profile.heroName=$('mHn').value.trim();save();syncBoard();closeModal();boardRows=null;render()">決定</button><button class="cmd" onclick="closeModal()">取消</button></div>`);
}

// ================= 啟動 =================
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
loadLocal();
render();
</script>
